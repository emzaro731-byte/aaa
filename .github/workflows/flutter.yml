name: AAA Flutter Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build target
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.emzaro.aaa --project-name aaa_mobile_studio .

      - name: Get packages
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Build APK
        if: ${{ github.event_name == 'push' || inputs.build_target == 'apk' || inputs.build_target == 'both' }}
        run: flutter build apk --release

      - name: Build AAB
        if: ${{ github.event_name == 'push' || inputs.build_target == 'aab' || inputs.build_target == 'both' }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: ${{ github.event_name == 'push' || inputs.build_target == 'apk' || inputs.build_target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: aaa-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: ${{ github.event_name == 'push' || inputs.build_target == 'aab' || inputs.build_target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: aaa-flutter-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab
