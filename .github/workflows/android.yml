name: AAA Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: Build target
        required: true
        default: both
        type: choice
        options:
          - apk
          - aab
          - both

permissions:
  contents: read

concurrency:
  group: aaa-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        if: ${{ github.event_name == 'push' || inputs.build_target == 'apk' || inputs.build_target == 'both' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release AAB
        if: ${{ github.event_name == 'push' || inputs.build_target == 'aab' || inputs.build_target == 'both' }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload APK
        if: ${{ github.event_name == 'push' || inputs.build_target == 'apk' || inputs.build_target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: aaa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        if: ${{ github.event_name == 'push' || inputs.build_target == 'aab' || inputs.build_target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: aaa-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
